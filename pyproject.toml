[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radarrt"
version = "0.1.0"
description = "Motor deterministico para estimar demanda reprimida de radioterapia no SUS."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "RadarRT contributors" },
]
keywords = [
    "radiotherapy",
    "public-health",
    "datasus",
    "text-to-sql",
    "health-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "requests>=2.31",
]

[project.optional-dependencies]
agent = [
    "duckdb>=1.0",
]
ingest = [
    "pysus>=2.0,<3; python_version < '3.13'",
    "duckdb>=1.0",
    "pyarrow>=16.0",
]
dashboard = [
    "duckdb>=1.0",
    "streamlit>=1.36",
    "pydeck>=0.9",
    "plotly>=5.22",
    "geopandas>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]
all = [
    "duckdb>=1.0",
    "pysus>=2.0,<3; python_version < '3.13'",
    "pyarrow>=16.0",
    "streamlit>=1.36",
    "pydeck>=0.9",
    "plotly>=5.22",
    "geopandas>=1.0",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/v1olegrace/radarrt"
Issues = "https://github.com/v1olegrace/radarrt/issues"

[project.scripts]
radarrt-indicadores = "radarrt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["radarrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".claude",
    ".pytest_cache",
    ".venv311",
    "files*",
    "stage5",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"streamlit_app.py" = ["E402", "I001"]
"run_indicadores.py" = ["E402", "I001"]
"scripts/probe.py" = ["E402", "I001"]
